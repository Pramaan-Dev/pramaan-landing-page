<!doctype html>

  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
      </style>
      <div data-hf-id="hf-cpjn" id="root" data-composition-id="story-5" data-width="1280" data-height="720">
        <div data-hf-id="hf-yf83" class="layer stage" id="s5">
          <div data-hf-id="hf-m9ls" class="approve" id="s5-card">
            <div data-hf-id="hf-6njn" class="approve-kicker">Needs your OK</div>
            <div data-hf-id="hf-q8no" class="approve-title">Email 24 people?</div>
            <div data-hf-id="hf-exrd" class="chips">
              <div data-hf-id="hf-kfqw" class="chip">Ana</div>
              <div data-hf-id="hf-3eiv" class="chip">Ben</div>
              <div data-hf-id="hf-cw2r" class="chip">Chloe</div>
              <div data-hf-id="hf-17fn" class="chip chip-more">+21 more</div>
            </div>
            <div data-hf-id="hf-g8rn" class="preview-row">
              <span data-hf-id="hf-pig2" class="pr-k">Message</span>
              <span data-hf-id="hf-8b3o" class="pr-quote">“Welcome aboard — here’s how to get started”</span>
            </div>
            <div data-hf-id="hf-zgc1" class="actions">
              <div data-hf-id="hf-8315" class="btn btn-no">Not now</div>
              <div data-hf-id="hf-q93d" class="btn btn-yes" id="s5-yes">Yes<div data-hf-id="hf-tf74" class="ripple" id="s5-ripple" data-layout-allow-overflow></div><svg data-hf-id="hf-hovy" class="pointer" id="s5-pointer" data-layout-allow-overflow viewBox="0 0 30 36"><path data-hf-id="hf-cn0e" d="M 2 2 L 2 28 L 9 21.5 L 13.5 32 L 18 30 L 13.5 19.8 L 23 19.8 Z" fill="#242424" stroke="#f6f3f1" stroke-width="1.6" stroke-linejoin="round" /></svg></div>
            </div>
          </div>
        </div>
        <div data-hf-id="hf-ppdu" class="layer stage" id="s5s">
          <div data-hf-id="hf-wfz2" class="result-pill" id="s5s-pill"><svg data-hf-id="hf-kijf" class="big-check" viewBox="0 0 40 40"><circle data-hf-id="hf-yqby" cx="20" cy="20" r="18.5" /><path data-hf-id="hf-denj" pathLength="1" d="M 12 20.5 L 17.5 26 L 28 14.5" /></svg><span data-hf-id="hf-tfzy">Sent to 24</span></div>
          <div data-hf-id="hf-2y0o" class="saved" id="s5s-saved"><svg data-hf-id="hf-0n2h" viewBox="0 0 20 20"><path data-hf-id="hf-evgv" pathLength="1" d="M 4 10.5 L 8 14.5 L 16 6" /></svg><span data-hf-id="hf-ukls">Saved to your history</span></div>
        </div>
      </div>
      <script>
      (function () {
        const H = (tl) => {
          const h = {
            popIn: (s, at, y = 40) => tl.fromTo(s, { opacity: 0, y }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, at),
            popOut: (s, at) => tl.to(s, { opacity: 0, y: -24, duration: 0.4, ease: "power2.in" }, at),
            fadeUp: (s, at) => tl.fromTo(s, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, at),
            rows: (s, at) => tl.fromTo(s, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out", stagger: 0.12 }, at),
            tagIn: (s, at) => tl.fromTo(s, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, at),
            draw: (s, at) => tl.fromTo(s, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, at),
            pillIn: (s, at) => tl.fromTo(s, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, at),
          };
          h.saved = (s, at) => { h.fadeUp(s, at); h.draw(s + " path", at + 0.1); };
          return h;
        };
        // card in -> pointer travels to Yes -> tap + two soft pulses -> card out
        function approval(tl, h, k, at, readFor) {
          h.popIn(`#${k}-card`, at, 60);
          const pt = `#${k}-pointer`;
          const rp = `#${k}-ripple`;
          const click = at + readFor;
          tl.fromTo(pt, { opacity: 0, x: 170, y: 140 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, click - 1.0);
          tl.to(pt, { x: -2, y: -2, duration: 0.7, ease: "back.out(1.25)" }, click - 0.95);
          tl.fromTo(pt, { scale: 1 }, { scale: 0.85, duration: 0.09, ease: "power2.in", yoyo: true, repeat: 1, transformOrigin: "0% 0%", immediateRender: false }, click);
          tl.fromTo(`#${k}-yes`, { scale: 1 }, { scale: 0.95, duration: 0.09, ease: "power2.in", yoyo: true, repeat: 1 }, click);
          [[click + 0.02, 0.55], [click + 0.55, 0.32]].forEach(([a, peak], i) => {
            tl.fromTo(rp, { scale: 0.4 }, { scale: 2.6, duration: 0.8, ease: "power2.out", immediateRender: i === 0 }, a);
            tl.fromTo(rp, { opacity: 0 }, { opacity: peak, duration: 0.12, ease: "power1.out", immediateRender: i === 0 }, a);
            tl.to(rp, { opacity: 0, duration: 0.42, ease: "power1.in" }, a + 0.14);
          });
          tl.to(pt, { opacity: 0, duration: 0.3, ease: "power1.in" }, click + 0.55);
          h.popOut(`#${k}-card`, click + 0.6);
          return click + 1.0;
        }
        // "done" pill with drawn check + "Saved to your history"
        function status(tl, h, k, at, hold) {
          h.pillIn(`#${k}-pill`, at);
          h.draw(`#${k}-pill path`, at + 0.2);
          h.saved(`#${k}-saved`, at + 0.45);
          h.popOut(`#${k}-pill`, at + hold);
          h.popOut(`#${k}-saved`, at + hold + 0.04);
          return at + hold + 0.45;
        }
        function build() {
          const tl = gsap.timeline({ paused: true });
          const h = H(tl);
          const st = approval(tl, h, "s5", 0.35, 2.7);
          status(tl, h, "s5s", st, 1.5);
          window.__timelines["story-5"] = tl;
          if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
        }
        document.fonts.ready.then(build);
      })();
      </script>
    </template>
  </body>
