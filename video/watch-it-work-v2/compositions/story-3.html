<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
      </style>
      <div data-hf-id="hf-wus9" id="root" data-composition-id="story-3" data-width="1280" data-height="720">
        <div data-hf-id="hf-dx05" class="layer stage" id="s3">
          <div data-hf-id="hf-9gzm" class="approve" id="s3-card">
            <div data-hf-id="hf-6njn" class="approve-kicker">Needs your OK</div>
            <div data-hf-id="hf-h69f" class="approve-title">Send the Sales Skills test to 3 people?</div>
            <div data-hf-id="hf-exrd" class="chips">
              <div data-hf-id="hf-fga2" class="chip">Arjun</div>
              <div data-hf-id="hf-epon" class="chip">Mei</div>
              <div data-hf-id="hf-ljlf" class="chip">Sara</div>
              <div data-hf-id="hf-1mpj" class="meta">Camera on · 45 min</div>
            </div>
            <div data-hf-id="hf-zgc1" class="actions">
              <div data-hf-id="hf-8315" class="btn btn-no">Not now</div>
              <div data-hf-id="hf-arnv" class="btn btn-yes" id="s3-yes">Yes<div data-hf-id="hf-5g1q" class="ripple" id="s3-ripple" data-layout-allow-overflow></div><svg data-hf-id="hf-h8m0" class="pointer" id="s3-pointer" data-layout-allow-overflow viewBox="0 0 30 36"><path data-hf-id="hf-cn0e" d="M 2 2 L 2 28 L 9 21.5 L 13.5 32 L 18 30 L 13.5 19.8 L 23 19.8 Z" fill="#242424" stroke="#f6f3f1" stroke-width="1.6" stroke-linejoin="round" /></svg></div>
            </div>
          </div>
        </div>
        <div data-hf-id="hf-mfb0" class="layer stage" id="s3s">
          <div data-hf-id="hf-uiic" class="result-pill" id="s3s-pill"><svg data-hf-id="hf-kijf" class="big-check" viewBox="0 0 40 40"><circle data-hf-id="hf-yqby" cx="20" cy="20" r="18.5" /><path data-hf-id="hf-denj" pathLength="1" d="M 12 20.5 L 17.5 26 L 28 14.5" /></svg><span data-hf-id="hf-nafl">Invites sent</span></div>
          <div data-hf-id="hf-3v0y" class="saved" id="s3s-saved"><svg data-hf-id="hf-0n2h" viewBox="0 0 20 20"><path data-hf-id="hf-evgv" pathLength="1" d="M 4 10.5 L 8 14.5 L 16 6" /></svg><span data-hf-id="hf-ukls">Saved to your history</span></div>
        </div>
        <div data-hf-id="hf-n6yt" class="layer stage" id="s3r">
          <div data-hf-id="hf-zb4h" class="later" id="s3r-later">Later…</div>
          <div data-hf-id="hf-q2ol" class="rcard" id="s3r-card">
            <div data-hf-id="hf-1fmb" class="rcard-head"><span data-hf-id="hf-fq5r" class="r-dot"></span><span data-hf-id="hf-kpoy">Sales Skills test · Results</span></div>
            <div data-hf-id="hf-thy4" class="row"><span data-hf-id="hf-nntk" class="k">Arjun</span><span data-hf-id="hf-dx0r" class="v">82</span></div>
            <div data-hf-id="hf-lt04" class="row"><span data-hf-id="hf-x489" class="k">Mei</span><span data-hf-id="hf-9876" class="v">74</span></div>
            <div data-hf-id="hf-km31" class="row"><span data-hf-id="hf-180x" class="k">Sara</span><span data-hf-id="hf-byfv" class="v">91</span></div>
            <div data-hf-id="hf-y4oo" class="rcard-foot" id="s3r-flag"><span data-hf-id="hf-l4sp" class="flag-dot"></span><span data-hf-id="hf-abt3">1 moment flagged for review</span></div>
          </div>
          <div data-hf-id="hf-krrb" class="saved" id="s3r-saved"><svg data-hf-id="hf-ebb1" viewBox="0 0 20 20"><path data-hf-id="hf-domn" pathLength="1" d="M 4 10.5 L 8 14.5 L 16 6" /></svg><span data-hf-id="hf-6fu0">Saved to your history</span></div>
        </div>
      </div>
      <script>
      (function () {
        const H = (tl) => {
          const h = {
            popIn: (s, at, y = 40) => tl.fromTo(s, { opacity: 0, y }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, at),
            popOut: (s, at) => tl.to(s, { opacity: 0, y: -24, duration: 0.4, ease: "power2.in" }, at),
            fadeUp: (s, at) => tl.fromTo(s, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, at),
            rows: (s, at) => tl.fromTo(s, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out", stagger: 0.12 }, at),
            tagIn: (s, at) => tl.fromTo(s, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, at),
            draw: (s, at) => tl.fromTo(s, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, at),
            pillIn: (s, at) => tl.fromTo(s, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, at),
          };
          h.saved = (s, at) => { h.fadeUp(s, at); h.draw(s + " path", at + 0.1); };
          return h;
        };
        // card in -> pointer travels to Yes -> tap + two soft pulses -> card out
        function approval(tl, h, k, at, readFor) {
          h.popIn(`#${k}-card`, at, 60);
          const pt = `#${k}-pointer`;
          const rp = `#${k}-ripple`;
          const click = at + readFor;
          tl.fromTo(pt, { opacity: 0, x: 170, y: 140 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, click - 1.0);
          tl.to(pt, { x: -2, y: -2, duration: 0.7, ease: "back.out(1.25)" }, click - 0.95);
          tl.fromTo(pt, { scale: 1 }, { scale: 0.85, duration: 0.09, ease: "power2.in", yoyo: true, repeat: 1, transformOrigin: "0% 0%", immediateRender: false }, click);
          tl.fromTo(`#${k}-yes`, { scale: 1 }, { scale: 0.95, duration: 0.09, ease: "power2.in", yoyo: true, repeat: 1 }, click);
          [[click + 0.02, 0.55], [click + 0.55, 0.32]].forEach(([a, peak], i) => {
            tl.fromTo(rp, { scale: 0.4 }, { scale: 2.6, duration: 0.8, ease: "power2.out", immediateRender: i === 0 }, a);
            tl.fromTo(rp, { opacity: 0 }, { opacity: peak, duration: 0.12, ease: "power1.out", immediateRender: i === 0 }, a);
            tl.to(rp, { opacity: 0, duration: 0.42, ease: "power1.in" }, a + 0.14);
          });
          tl.to(pt, { opacity: 0, duration: 0.3, ease: "power1.in" }, click + 0.55);
          h.popOut(`#${k}-card`, click + 0.6);
          return click + 1.0;
        }
        // "done" pill with drawn check + "Saved to your history"
        function status(tl, h, k, at, hold) {
          h.pillIn(`#${k}-pill`, at);
          h.draw(`#${k}-pill path`, at + 0.2);
          h.saved(`#${k}-saved`, at + 0.45);
          h.popOut(`#${k}-pill`, at + hold);
          h.popOut(`#${k}-saved`, at + hold + 0.04);
          return at + hold + 0.45;
        }
        function build() {
          const tl = gsap.timeline({ paused: true });
          const h = H(tl);
          const st = approval(tl, h, "s3", 0.35, 2.5);
          const next = status(tl, h, "s3s", st, 1.45);
          h.fadeUp("#s3r-later", next + 0.1);
          h.popIn("#s3r-card", next + 0.4);
          h.rows("#s3r-card .row", next + 0.7);
          h.fadeUp("#s3r-flag", next + 1.25);
          tl.fromTo("#s3r-flag .flag-dot", { scale: 0.4 }, { scale: 1, duration: 0.45, ease: "back.out(2.4)" }, next + 1.3);
          h.saved("#s3r-saved", next + 1.6);
          ["#s3r-later", "#s3r-card", "#s3r-saved"].forEach((s, i) => h.popOut(s, next + 4.1 + i * 0.04));
          window.__timelines["story-3"] = tl;
          if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
        }
        document.fonts.ready.then(build);
      })();
      </script>
    </template>
  </body>
</html>
